[workspace]
resolver = "3"
members = ["apps/desktop/src-tauri", "tools/checklist-gate"]

[workspace.package]
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
clap = { version = "4.6.8", features = ["derive"] }
regex = "1.13.1"
tempfile = "3.27.0"
thiserror = "2.0.21"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "abort"
