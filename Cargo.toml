[workspace]
resolver = "3"
members = [
  "apps/desktop/src-tauri",
  "crates/dea-project",
  "tools/arch-check",
  "tools/checklist-gate",
  "tools/perf-probe",
]

[workspace.package]
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
cargo_metadata = "0.23.1"
clap = { version = "4.6.8", features = ["derive"] }
flate2 = "1.1.11"
jsonschema = { version = "0.61.2", default-features = false }
libc = "0.2.191"
notify-debouncer-full = "0.7.0"
rand = "0.10.4"
regex = "1.13.1"
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_norway = "0.9.42"
sysinfo = "0.40.4"
tempfile = "3.27.0"
thiserror = "2.0.21"
time = "0.3.55"
toml = "1.2.1"
uuid = { version = "1.29.3", features = ["v4"] }
windows-sys = "0.61.2"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "abort"
