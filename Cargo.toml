[workspace]
resolver = "3"
members = [
  "apps/desktop/src-tauri",
  "crates/dea-project",
  "tools/checklist-gate",
]

[workspace.package]
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
clap = { version = "4.6.8", features = ["derive"] }
rand = "0.10.4"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_norway = "0.9.42"
tempfile = "3.27.0"
thiserror = "2.0.21"
time = "0.3.55"
uuid = { version = "1.29.3", features = ["v4"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "abort"
