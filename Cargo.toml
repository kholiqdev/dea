[workspace]
resolver = "3"
members = [
  "apps/desktop/src-tauri",
  "crates/dea-project",
  "crates/dea-testkit",
  "crates/dea-vault",
  "tools/arch-check",
  "tools/checklist-gate",
  "tools/perf-probe",
]

[workspace.package]
edition = "2024"
license = "Apache-2.0"

[workspace.lints.rust]
# Unsafe code is opted into per module, with a reason (see perf-probe).
unsafe_code = "deny"
unused_qualifications = "warn"

[workspace.lints.clippy]
# Left-overs from debugging never reach main.
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
# Every unsafe block says why it is sound.
undocumented_unsafe_blocks = "deny"
# Pedantic lints that catch real mistakes without much noise.
cast_lossless = "warn"
cloned_instead_of_copied = "warn"
implicit_clone = "warn"
inefficient_to_string = "warn"
manual_let_else = "warn"
map_unwrap_or = "warn"
redundant_closure_for_method_calls = "warn"
semicolon_if_nothing_returned = "warn"
uninlined_format_args = "warn"
unnested_or_patterns = "warn"

[workspace.dependencies]
aes-gcm = "0.11.1"
argon2 = { version = "0.6.0", features = ["password-hash"] }
base64 = "0.23.1"
cargo_metadata = "0.23.1"
dea-project = { path = "crates/dea-project" }
dea-testkit = { path = "crates/dea-testkit" }
dea-vault = { path = "crates/dea-vault" }
clap = { version = "4.6.8", features = ["derive"] }
flate2 = "1.1.11"
jsonschema = { version = "0.61.2", default-features = false }
libc = "0.2.191"
notify = "8.2.2"
rand = "0.10.4"
regex = "1.13.1"
schemars = "1.2.3"
secrecy = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_norway = "0.9.42"
sha2 = "0.11.1"
sysinfo = "0.40.4"
tempfile = "3.27.0"
thiserror = "2.0.21"
time = "0.3.55"
toml = "1.2.1"
uuid = { version = "1.29.3", features = ["v4"] }
windows-sys = "0.61.2"
zeroize = "1.9.2"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "abort"
