name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  NODE_VERSION: 26

jobs:
  rust:
    name: rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-22.04 is the oldest Linux release we support.
        os: [ubuntu-22.04, macos-15, windows-2022]
    steps:
      - uses: actions/checkout@v7
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev \
            libssl-dev libayatana-appindicator3-dev librsvg2-dev \
            dbus gnome-keyring
      - name: Install Rust toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # The Vault tests use the real keychain and screen lock events of
      # each OS.
      - name: Test
        if: runner.os != 'Linux'
        env:
          DEA_KEYCHAIN_TESTS: "1"
          DEA_OS_EVENT_TESTS: "1"
          DEA_EXPECT_BACKEND: keychain
        run: cargo test --workspace
      - name: Test with a Secret Service
        if: runner.os == 'Linux'
        env:
          DEA_KEYCHAIN_TESTS: "1"
          DEA_OS_EVENT_TESTS: "1"
          DEA_EXPECT_BACKEND: keychain
        run: |
          dbus-run-session -- bash -c '
            printf "dea" | gnome-keyring-daemon --unlock --components=secrets
            cargo test --workspace
          '
      - name: Test the encrypted file fallback without a Secret Service
        if: runner.os == 'Linux'
        env:
          DEA_EXPECT_BACKEND: encrypted-file
        run: |
          env -u DBUS_SESSION_BUS_ADDRESS XDG_RUNTIME_DIR=/nonexistent \
            cargo test -p dea-vault --test detect
      - name: Check the IPC bindings are up to date
        if: runner.os == 'Linux'
        run: |
          cargo test -p dea-engine --features ts export_bindings
          git add -N apps/desktop/src/lib/ipc/bindings
          git diff --exit-code apps/desktop/src/lib/ipc/bindings || {
            echo "::error::Run cargo test -p dea-engine --features ts export_bindings and commit the result"
            exit 1
          }
      - name: Install cargo-deny
        if: runner.os == 'Linux'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - name: Check licenses, advisories and banned crates
        if: runner.os == 'Linux'
        run: cargo deny check

  web:
    name: web (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-15, windows-2022]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test

  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-15, windows-2022]
    steps:
      - uses: actions/checkout@v7
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev \
            libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Install Rust toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter desktop tauri build --debug --no-bundle

  # macOS has no WebDriver for WKWebView, so the end-to-end tests run on
  # Linux and Windows only.
  e2e:
    name: e2e (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022]
    steps:
      - uses: actions/checkout@v7
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev \
            libssl-dev libayatana-appindicator3-dev librsvg2-dev \
            webkit2gtk-driver xvfb
      - name: Install Rust toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install tauri-driver
        run: cargo install tauri-driver --locked
      - name: Install the msedgedriver that matches WebView2
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $key = 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
          $version = (Get-ItemProperty -Path $key -ErrorAction SilentlyContinue).pv
          if (-not $version) {
            $version = (Get-Item 'C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe').VersionInfo.ProductVersion
          }
          Write-Host "WebView2 $version"
          $zip = Join-Path $env:RUNNER_TEMP 'edgedriver.zip'
          $dir = Join-Path $env:RUNNER_TEMP 'edgedriver'
          Invoke-WebRequest "https://msedgedriver.microsoft.com/$version/edgedriver_win64.zip" -OutFile $zip
          Expand-Archive $zip -DestinationPath $dir
          $dir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - run: pnpm --filter desktop tauri build --debug --no-bundle
      - name: Run the end-to-end tests
        if: runner.os == 'Linux'
        run: xvfb-run -a pnpm --filter desktop e2e
      - name: Run the end-to-end tests
        if: runner.os == 'Windows'
        run: pnpm --filter desktop e2e

  arch:
    name: architecture
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      # Reads manifests only, so the Tauri system libraries are not needed.
      - name: Check crate layers
        run: cargo run --locked -p arch-check

  checklist:
    name: checklist
    # Secrets are not available to pull requests from forks.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Check access to the planning repository
        id: access
        env:
          PLANNING_REPO: ${{ vars.PLANNING_REPO }}
          PLANNING_REPO_TOKEN: ${{ secrets.PLANNING_REPO_TOKEN }}
        run: |
          if [ -z "$PLANNING_REPO" ] || [ -z "$PLANNING_REPO_TOKEN" ]; then
            echo "Planning repo not configured, skipping"
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v7
        if: steps.access.outputs.configured == 'true'
      - uses: actions/checkout@v7
        if: steps.access.outputs.configured == 'true'
        with:
          repository: ${{ vars.PLANNING_REPO }}
          token: ${{ secrets.PLANNING_REPO_TOKEN }}
          path: docs
          persist-credentials: false
      - name: Install Rust toolchain
        if: steps.access.outputs.configured == 'true'
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        if: steps.access.outputs.configured == 'true'
      # Progress report only: never blocks a pull request, prints counts only.
      - name: Report checklist progress
        if: steps.access.outputs.configured == 'true'
        run: cargo run --locked -p checklist-gate -- --phase 1 --docs docs --report-only --summary

  commits:
    name: commits
    # Dependabot writes its own titles, which can be longer than 72 characters.
    if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint commit messages
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: pnpm commitlint --from "$BASE_SHA" --to "$HEAD_SHA" --verbose
