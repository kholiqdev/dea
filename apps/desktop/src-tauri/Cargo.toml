[package]
name = "dea-desktop"
version = "0.1.0"
description = "Dea desktop app"
edition.workspace = true
license.workspace = true
rust-version = "1.99"
publish = false

[lib]
name = "dea_desktop"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[lints]
workspace = true

[dependencies]
dea-engine.workspace = true
dea-project.workspace = true
serde = { workspace = true, features = ["derive"] }
tauri = { version = "2.12.5", features = [] }
tauri-plugin-dialog = "2.8.4"

[dev-dependencies]
serde_json.workspace = true
tempfile.workspace = true
