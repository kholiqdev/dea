[graph]
targets = [
  "x86_64-unknown-linux-gnu",
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
  "x86_64-pc-windows-msvc",
  "aarch64-pc-windows-msvc",
]
all-features = true

[advisories]
# Every ignored advisory needs a reason next to it.
ignore = [
  { id = "RUSTSEC-2024-0370", reason = "proc-macro-error is a build-time macro pulled in by the GTK3 bindings Tauri uses on Linux; no upgrade until Tauri moves off gtk-rs 0.18" },
  # zbus 5 subcrates that were merged into zbus 6. Not vulnerabilities. Pulled
  # in on Linux by zbus-secret-service-keyring-store; drop these once it moves
  # to secret-service 6 (zbus 6), which is still a release candidate.
  { id = "RUSTSEC-2026-0370", reason = "zvariant merged into zbus 6; used through zbus 5 by the Linux Secret Service store" },
  { id = "RUSTSEC-2026-0371", reason = "zbus_names merged into zbus 6; used through zbus 5 by the Linux Secret Service store" },
  { id = "RUSTSEC-2026-0372", reason = "zvariant_derive merged into zbus 6; used through zbus 5 by the Linux Secret Service store" },
]

[licenses]
# All of these are compatible with Apache-2.0.
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  # Public domain dedication, no conditions. Used by notify, the file watcher.
  "CC0-1.0",
  "MIT",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "MPL-2.0",
]
confidence-threshold = 0.9
# Some allowed licenses only show up once more crates are added.
unused-allowed-license = "allow"

[bans]
multiple-versions = "allow"
wildcards = "deny"
# Path dependencies between workspace crates have no version; allowed
# because every crate here is `publish = false`.
allow-wildcard-paths = true
deny = [
  { crate = "serde_yaml", reason = "unmaintained, use serde_norway" },
  { crate = "serde_yaml_ng", reason = "use serde_norway" },
  { crate = "serde_yml", reason = "use serde_norway" },
  { crate = "openssl-sys", reason = "TLS goes through rustls" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
