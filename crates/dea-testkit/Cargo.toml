[package]
name = "dea-testkit"
version = "0.1.0"
description = "Test helpers shared by Dea crates"
edition.workspace = true
license.workspace = true
rust-version = "1.99"
publish = false

[features]
# The local HTTP test server. Off by default, so crates that only need the
# canary don't compile hyper and rustls.
http = [
  "dep:bytes",
  "dep:flate2",
  "dep:http-body-util",
  "dep:hyper",
  "dep:hyper-util",
  "dep:rcgen",
  "dep:rustls",
  "dep:time",
  "dep:tokio",
  "dep:tokio-rustls",
  "dep:url",
]

[lints]
workspace = true

[dependencies]
base64.workspace = true
bytes = { workspace = true, optional = true }
flate2 = { workspace = true, optional = true }
http-body-util = { workspace = true, optional = true }
hyper = { workspace = true, optional = true, features = ["http1", "http2", "server"] }
hyper-util = { workspace = true, optional = true, features = ["tokio"] }
rcgen = { workspace = true, optional = true }
rustls = { workspace = true, optional = true }
time = { workspace = true, optional = true }
tokio = { workspace = true, optional = true, features = ["io-util", "macros", "net", "rt", "sync", "time"] }
tokio-rustls = { workspace = true, optional = true }
url = { workspace = true, optional = true }
uuid.workspace = true

[dev-dependencies]
tempfile.workspace = true
