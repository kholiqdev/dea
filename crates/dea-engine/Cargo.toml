[package]
name = "dea-engine"
version = "0.1.0"
description = "Puts the Dea feature crates together for the desktop app and the CLI"
edition.workspace = true
license.workspace = true
rust-version = "1.99"
publish = false

[features]
# Writes the TypeScript bindings of the IPC types (test `export_bindings`).
ts = ["dep:ts-rs", "dea-project/ts"]

[lints]
workspace = true

[dependencies]
arboard.workspace = true
dea-http.workspace = true
dea-project.workspace = true
dea-vault.workspace = true
rand.workspace = true
secrecy.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
serde_json_path.workspace = true
sha2.workspace = true
tempfile.workspace = true
thiserror.workspace = true
time = { workspace = true, features = ["formatting", "parsing"] }
tokio = { workspace = true, features = ["rt"] }
ts-rs = { workspace = true, optional = true }
url.workspace = true
zeroize.workspace = true

[dev-dependencies]
bytes.workspace = true
dea-testkit = { workspace = true, features = ["http"] }
tokio = { workspace = true, features = ["macros", "rt"] }
