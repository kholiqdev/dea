[package]
name = "dea-vault"
version = "0.1.0"
description = "Stores Dea secrets in the operating system keychain"
edition.workspace = true
license.workspace = true
rust-version = "1.99"
publish = false

[lints]
workspace = true

[dependencies]
aes-gcm.workspace = true
argon2.workspace = true
dea-project.workspace = true
keyring-core.workspace = true
rand.workspace = true
secrecy.workspace = true
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true
thiserror.workspace = true
time = { workspace = true, features = ["serde", "formatting", "parsing"] }
zeroize.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store.workspace = true
block2.workspace = true
objc2.workspace = true
objc2-app-kit.workspace = true
objc2-foundation.workspace = true
objc2-local-authentication.workspace = true

[target.'cfg(windows)'.dependencies]
windows.workspace = true
windows-future.workspace = true
windows-native-keyring-store.workspace = true
windows-sys = { workspace = true, features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Security",
  "Win32_Security_Credentials",
  "Win32_System_Com",
  "Win32_System_LibraryLoader",
  "Win32_System_Power",
  "Win32_System_RemoteDesktop",
  "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "linux")'.dependencies]
zbus.workspace = true
zbus-secret-service-keyring-store.workspace = true

[dev-dependencies]
dea-testkit.workspace = true
uuid.workspace = true
time = { workspace = true, features = ["macros"] }

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { workspace = true, features = ["Win32_System_Console"] }

[[test]]
name = "os_events"
harness = false
