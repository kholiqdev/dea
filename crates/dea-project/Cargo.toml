[package]
name = "dea-project"
version = "0.1.0"
description = "Reads and writes Dea project folders"
edition.workspace = true
license.workspace = true
rust-version = "1.99"
publish = false

[features]
# Writes the TypeScript bindings of the types the desktop app shows.
ts = ["dep:ts-rs"]

[lints]
workspace = true

[dependencies]
notify.workspace = true
rand.workspace = true
regex.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_norway.workspace = true
sha2.workspace = true
tempfile.workspace = true
thiserror.workspace = true
time.workspace = true
ts-rs = { workspace = true, optional = true }
uuid.workspace = true

[dev-dependencies]
jsonschema.workspace = true
time = { workspace = true, features = ["macros"] }
